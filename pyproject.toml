[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpa-dates"
version = "2.0.2"
description = "Dates actions for RPA"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Grzegorz Zioło", email = "kontakt@ziolo.be" },
]
keywords = ["dates", "datetime", "business-days", "holidays"]
dependencies = [
    "requests>=2.32.4",
    "python-dateutil>=2.8.2",
    "holidays",
    "pytest>=9.0.2",
    "hatchling>=1.29.0",
    "types-python-dateutil>=2.9.0.20251115",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pyrefly",
    "bandit",
    "ruff",
    "types-requests",
    "types-python-dateutil",
]

# --- Tool Configurations ---

[tool.hatch.build.targets.wheel]
packages = ["src/rpa_dates"]



[tool.ruff]
line-length = 180
target-version = "py310"

[tool.pytest.ini_options]
addopts = "--cov=rpa_dates --cov-report=term-missing"
testpaths = ["tests"]
