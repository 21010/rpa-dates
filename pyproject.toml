[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpa-dates"
version = "2.0.3"
description = "A comprehensive Python utility library for handling dates, business days, and holidays in Robotic Process Automation (RPA) workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Grzegorz Zioło", email = "kontakt@ziolo.be" },
]
keywords = ["dates", "datetime", "business-days", "holidays"]
dependencies = [
    "holidays",
    "python-dateutil>=2.8.2",
    "requests>=2.32.4",
]

[dependency-groups]
dev = [
    "bandit",
    "pyrefly",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-python-dateutil",
    "types-requests",
]

# --- Tool Configurations ---

[tool.hatch.build.targets.wheel]
packages = ["src/rpa_dates"]



[tool.ruff]
line-length = 180
target-version = "py310"

[tool.pytest.ini_options]
addopts = "--cov=rpa_dates --cov-report=term-missing"
testpaths = ["tests"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
